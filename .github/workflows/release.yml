name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^project(JiebaCPP VERSION \([^ ]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          test "$version" = "$project_version"
      - name: Create source archives
        run: |
          prefix="Jieba-CPP-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="${prefix}/" -o "${prefix}.tar.gz" HEAD
          git archive --format=zip --prefix="${prefix}/" -o "${prefix}.zip" HEAD
          sha256sum "${prefix}.tar.gz" "${prefix}.zip" > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Jieba-CPP-*.tar.gz
            Jieba-CPP-*.zip
            SHA256SUMS
